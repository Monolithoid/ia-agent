name: Build & Push — Images robotiques

# Publie six images sur Docker Hub :
#   monolithoid/naoqi-bridge  → Python 3.12 Alpine, HTTP bridge Flask vers NAO
#   monolithoid/nao-core      → ROS2 Humble, naoqi-driver + cognitive-renderer + motion-engine
#                               + static-driver (drone statique, ADR 004)
#   monolithoid/body-gateway  → ROS2 Humble, pont LLM ↔ bus ROS2
#   monolithoid/ros2-bridge   → ROS2 Humble + rosbridge_server WebSocket :9090
#   monolithoid/twitch-input  → Python 3.12, entrée tchat Twitch « !nao » → body-gateway
#   monolithoid/obs-agent     → Python 3.12, voix de NAO dans OBS (corps « voix » via rosbridge)
#
# Secrets requis :
#   DOCKERHUB_USERNAME : monolithoid
#   DOCKERHUB_TOKEN    : Docker Hub → Account Settings → Security → New Access Token

on:
  push:
    branches:
      - main
    paths:
      - 'robotics/brain/**'
      - 'robotics/drones/nao/**'
      - 'robotics/drones/static/driver/**'
      - 'robotics/drones/obs/**'
      - 'robotics/inputs/**'
      - 'robotics/shared/**'
      - '.github/workflows/build-robotics.yml'

  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: naoqi-bridge
            image: monolithoid/naoqi-bridge
            context: ./robotics/drones/nao/bridge
            dockerfile: ./robotics/drones/nao/bridge/Dockerfile

          - name: nao-core
            image: monolithoid/nao-core
            context: ./robotics
            dockerfile: ./robotics/drones/nao/core/Dockerfile

          - name: body-gateway
            image: monolithoid/body-gateway
            context: ./robotics/brain/body_gateway
            dockerfile: ./robotics/brain/body_gateway/Dockerfile

          - name: ros2-bridge
            image: monolithoid/ros2-bridge
            context: ./robotics/brain/ros2_bridge
            dockerfile: ./robotics/brain/ros2_bridge/Dockerfile

          - name: twitch-input
            image: monolithoid/twitch-input
            context: ./robotics/inputs/twitch
            dockerfile: ./robotics/inputs/twitch/Dockerfile

          - name: obs-agent
            image: monolithoid/obs-agent
            context: ./robotics/drones/obs
            dockerfile: ./robotics/drones/obs/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=build-${{ github.run_number }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          platforms: linux/amd64

      - name: Build summary
        run: |
          echo "## ${{ matrix.name }} publié" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Commande |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| latest | \`docker pull ${{ matrix.image }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| build  | \`docker pull ${{ matrix.image }}:build-${{ github.run_number }}\` |" >> $GITHUB_STEP_SUMMARY
