name: Build & Push — Images robotiques

# Publie six images sur Docker Hub :
#   monolithoid/nao-gateway        → FastAPI bridge n8n → rosbridge → NAO
#   monolithoid/ros2-bridge        → ROS 2 Jazzy + rosbridge_suite WebSocket
#   monolithoid/naoqi-bridge       → Python 2.7 + qi SDK HTTP/SSE bridge
#   monolithoid/naoqi-driver       → ROS2 Humble node /naoqi/* topics
#   monolithoid/cognitive-renderer → ROS2 Humble node états cognitifs → LEDs
#   monolithoid/nao-brain          → ROS2 Humble agent principal Qwen3
#   monolithoid/dream-engine       → ROS2 Humble consolidation nocturne
#
# Secrets requis (mêmes que build-bitterbot) :
#   DOCKERHUB_USERNAME : monolithoid
#   DOCKERHUB_TOKEN    : Docker Hub → Account Settings → Security → New Access Token

on:
  push:
    branches:
      - main
    paths:
      - 'robotics/nao/gateway/**'
      - 'robotics/ros2/**'
      - 'robotics/nao_brain/**'
      - '.github/workflows/build-robotics.yml'

  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nao-gateway
            image: monolithoid/nao-gateway
            context: ./robotics/nao/gateway
            dockerfile: ./robotics/nao/gateway/Dockerfile

          - name: ros2-bridge
            image: monolithoid/ros2-bridge
            context: ./robotics/ros2
            dockerfile: ./robotics/ros2/Dockerfile

          - name: naoqi-bridge
            image: monolithoid/naoqi-bridge
            context: ./robotics/nao_brain/naoqi_bridge
            dockerfile: ./robotics/nao_brain/naoqi_bridge/Dockerfile

          - name: naoqi-driver
            image: monolithoid/naoqi-driver
            context: ./robotics/nao_brain/naoqi_driver
            dockerfile: ./robotics/nao_brain/naoqi_driver/Dockerfile

          - name: cognitive-renderer
            image: monolithoid/cognitive-renderer
            context: ./robotics/nao_brain/cognitive_renderer
            dockerfile: ./robotics/nao_brain/cognitive_renderer/Dockerfile

          - name: nao-brain
            image: monolithoid/nao-brain
            context: ./robotics/nao_brain/nao_brain_agent
            dockerfile: ./robotics/nao_brain/nao_brain_agent/Dockerfile

          - name: dream-engine
            image: monolithoid/dream-engine
            context: ./robotics/nao_brain/dream_engine
            dockerfile: ./robotics/nao_brain/dream_engine/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=build-${{ github.run_number }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          platforms: linux/amd64

      - name: Build summary
        run: |
          echo "## ${{ matrix.name }} publié" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Commande |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| latest | \`docker pull ${{ matrix.image }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| build  | \`docker pull ${{ matrix.image }}:build-${{ github.run_number }}\` |" >> $GITHUB_STEP_SUMMARY
