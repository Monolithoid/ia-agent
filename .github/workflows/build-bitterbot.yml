name: Build & Push — Bitterbot image

# Rebuilds the Bitterbot image from the official source repo and
# pushes it to Docker Hub so the VPS can simply `docker pull`.
#
# Secrets requis dans GitHub → Settings → Secrets → Actions :
#   DOCKERHUB_USERNAME : monolithoid
#   DOCKERHUB_TOKEN    : Docker Hub → Account Settings → Security → New Access Token
#
# Pourquoi on épingle un SHA et pas `main` :
#   Le commit e0d7d12 ("ablation testing", 9 avr. 2026) a supprimé curiosity-math.ts
#   et remanié des types — la compilation TypeScript échoue sur la tête de main.
#   On pointe sur be7b696 (8 avr. 2026), dernier état stable vérifié.
#   Pour avancer vers un nouveau commit : changer BITTERBOT_DEFAULT_REF ci-dessous
#   ou utiliser l'input "bitterbot_ref" du déclenchement manuel.

env:
  # Dernier commit vérifié comme compilable.
  # Changer cette valeur pour avancer vers une nouvelle version de Bitterbot.
  BITTERBOT_DEFAULT_REF: be7b696

on:
  # Rebuild hebdomadaire automatique (lundi 03h00 UTC)
  schedule:
    - cron: '0 3 * * 1'

  # Déclenchement manuel avec ref optionnel
  # → GitHub Actions → "Run workflow" → champ "Bitterbot commit SHA or branch"
  workflow_dispatch:
    inputs:
      bitterbot_ref:
        description: 'Bitterbot commit SHA ou branche (laisser vide = BITTERBOT_DEFAULT_REF)'
        required: false
        default: ''

  # Rebuild si ce fichier de workflow est modifié (ex: changement de SHA)
  push:
    paths:
      - '.github/workflows/build-bitterbot.yml'

jobs:
  build-and-push:
    name: Build & Push monolithoid/bitterbot
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ----------------------------------------------------------------
      # 1. Résoudre le ref à utiliser
      #    Priorité : input manuel > BITTERBOT_DEFAULT_REF
      # ----------------------------------------------------------------
      - name: Resolve Bitterbot ref
        id: ref
        run: |
          INPUT_REF="${{ github.event.inputs.bitterbot_ref }}"
          if [ -n "$INPUT_REF" ]; then
            echo "ref=$INPUT_REF" >> $GITHUB_OUTPUT
            echo "source=manual input" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ env.BITTERBOT_DEFAULT_REF }}" >> $GITHUB_OUTPUT
            echo "source=default (BITTERBOT_DEFAULT_REF)" >> $GITHUB_OUTPUT
          fi

      - name: Log ref used
        run: |
          echo "Building from ref : ${{ steps.ref.outputs.ref }}"
          echo "Source            : ${{ steps.ref.outputs.source }}"

      # ----------------------------------------------------------------
      # 2. Authentification Docker Hub
      # ----------------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------------------------------
      # 3. QEMU + Buildx
      # ----------------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------------------
      # 4. Métadonnées — tags OCI
      # ----------------------------------------------------------------
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: monolithoid/bitterbot
          tags: |
            type=raw,value=latest
            type=raw,value=build-${{ github.run_number }}
            type=raw,value=ref-${{ steps.ref.outputs.ref }}

      # ----------------------------------------------------------------
      # 5. Build + push
      #
      # Syntaxe Docker pour pointer un commit précis d'un repo GitHub :
      #   https://github.com/<org>/<repo>.git#<sha>
      #
      # Docker clone le repo, checkout le SHA, exécute le Dockerfile
      # du projet, puis pousse l'image résultante.
      # ----------------------------------------------------------------
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/Bitterbot-AI/bitterbot-desktop.git#${{ steps.ref.outputs.ref }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # ----------------------------------------------------------------
      # 6. Résumé dans l'onglet Actions
      # ----------------------------------------------------------------
      - name: Build summary
        run: |
          echo "## Image publiée" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Ref Bitterbot :** \`${{ steps.ref.outputs.ref }}\` (${{ steps.ref.outputs.source }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Commande |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| latest | \`docker pull monolithoid/bitterbot:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| versionné | \`docker pull monolithoid/bitterbot:build-${{ github.run_number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| par ref | \`docker pull monolithoid/bitterbot:ref-${{ steps.ref.outputs.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pour mettre à jour le VPS :" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker compose pull bitterbot-gateway && docker compose up -d bitterbot-gateway" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
