name: Build & Push — Bitterbot image

# Rebuilds the Bitterbot image from the official source repo and
# pushes it to Docker Hub so the VPS can simply `docker pull`.
#
# Secrets requis dans GitHub → Settings → Secrets → Actions :
#   DOCKERHUB_USERNAME : monolithoid
#   DOCKERHUB_TOKEN    : Docker Hub → Account Settings → Security → New Access Token

on:
  # Rebuild hebdomadaire automatique (lundi 03h00 UTC)
  # → récupère les éventuels patches de sécurité upstream
  schedule:
    - cron: '0 3 * * 1'

  # Déclenchement manuel depuis GitHub → Actions → "Run workflow"
  workflow_dispatch:

  # Rebuild si ce fichier de workflow est modifié (ex: changement de tag)
  push:
    paths:
      - '.github/workflows/build-bitterbot.yml'

jobs:
  build-and-push:
    name: Build & Push monolithoid/bitterbot
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ----------------------------------------------------------------
      # 1. Authentification Docker Hub
      # ----------------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------------------------------
      # 2. QEMU + Buildx — support multi-plateforme si besoin
      # ----------------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------------------
      # 3. Métadonnées — tags et labels OCI
      # ----------------------------------------------------------------
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: monolithoid/bitterbot
          tags: |
            # Tag fixe pour le docker-compose du VPS
            type=raw,value=latest
            # Tag versionné pour rollback : ex. build-42
            type=raw,value=build-${{ github.run_number }}

      # ----------------------------------------------------------------
      # 4. Build depuis le dépôt source officiel + push Docker Hub
      #
      # Le contexte est l'URL GitHub du projet Bitterbot.
      # Docker clone le repo, exécute son Dockerfile, et pousse
      # l'image résultante sur monolithoid/bitterbot.
      # ----------------------------------------------------------------
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/Bitterbot-AI/bitterbot-desktop.git
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache GitHub Actions — accélère les builds suivants (~2x)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Architecture du VPS (linux/amd64)
          # Ajouter linux/arm64 si tu as un Raspberry Pi ou Mac M1
          platforms: linux/amd64

      # ----------------------------------------------------------------
      # 5. Résumé du build dans l'onglet Actions
      # ----------------------------------------------------------------
      - name: Build summary
        run: |
          echo "## Image publiée" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| latest | \`docker pull monolithoid/bitterbot:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| versionné | \`docker pull monolithoid/bitterbot:build-${{ github.run_number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pour mettre à jour le VPS :" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker compose pull bitterbot-gateway && docker compose up -d bitterbot-gateway" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
