version: "3.8"

# ============================================================
# STACK IA — monolithoid.com
# ============================================================
# Services exposés publiquement :
#   - chat.monolithoid.com     → Open WebUI  (port 3000)
#   - ollama.monolithoid.com   → API Ollama  (port 11434)
#
# Services internes uniquement :
#   - n8n          → port 5678  (voir section N8N ci-dessous)
#   - chromadb     → port 8000  (jamais exposer)
#   - nao-gateway  → port 8001  (SSH tunnel uniquement)
#
# Données stockées dans /opt/ia/ sur le VPS :
#   /opt/ia/ollama/     → modèles IA (10-20 Go)
#   /opt/ia/webui/      → agents, utilisateurs, historique
#   /opt/ia/n8n/        → workflows
#   /opt/ia/chroma/     → base vectorielle
#
# AVANT DE DÉPLOYER :
#   1. Créer les dossiers sur le VPS :
#      mkdir -p /opt/ia/ollama /opt/ia/webui /opt/ia/n8n /opt/ia/chroma
#
#   2. Configurer les variables dans Coolify → Environment Variables :
#      OLLAMA_API_KEYS          : openssl rand -hex 32
#      WEBUI_SECRET_KEY         : openssl rand -hex 32
#      N8N_BASIC_AUTH_PASSWORD  : mot de passe de ton choix
#      OAUTH_CLIENT_ID          : console.cloud.google.com → APIs → OAuth 2.0
#      OAUTH_CLIENT_SECRET      : idem
#      GATEWAY_API_KEY          : openssl rand -hex 32  (clé X-API-Key pour n8n → NAO)
#
#   3. Firewall :
#      ufw allow 22
#      ufw allow 80
#      ufw allow 443
#      ufw allow 9090   # rosbridge — NAO se connecte depuis l'extérieur
#      ufw deny 11434
#      ufw deny 3000
#      ufw deny 5678
#      ufw enable
#
# COOLIFY — déploiement :
#   Créer un projet "IA" dans Coolify → Docker Compose → pointer sur ce dépôt.
#   Toutes les variables ${VAR} sont injectées depuis Coolify → Environment Variables.
#   Stop/Start depuis l'onglet Services du projet.
#   Les données dans /opt/ia/ sont préservées.
# ============================================================

services:

  # ----------------------------------------------------------
  # OLLAMA — moteur LLM
  # Port interne : 11434
  # Exposé via : ollama.monolithoid.com
  # Protégé par : OLLAMA_API_KEYS
  # ----------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - /opt/ia/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_NUM_THREAD=8
      - OLLAMA_API_KEYS=${OLLAMA_API_KEYS}
    networks:
      - ai-network
      - bitterbot-net   # Bitterbot appelle Ollama via ce réseau isolé

  # ----------------------------------------------------------
  # OPEN WEBUI — interface agents
  # Port interne : 8080
  # Exposé via : chat.monolithoid.com
  # Protégé par : Google SSO
  #
  # Accès restreint aux comptes Google autorisés.
  # Les inscriptions libres sont désactivées (ENABLE_SIGNUP=false).
  # Pour autoriser plusieurs domaines Google :
  #   GOOGLE_ALLOWED_DOMAINS=domaine1.com,domaine2.com
  # Pour un accès personnel sans restriction de domaine :
  #   supprimer la ligne GOOGLE_ALLOWED_DOMAINS
  # ----------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - /opt/ia/webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_API_KEY=${OLLAMA_API_KEYS}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - CHROMA_HTTP_HOST=chromadb
      - CHROMA_HTTP_PORT=8000
      - DEFAULT_MODELS=qwen2.5:7b
      # Inscriptions libres désactivées — accès par Google SSO uniquement
      - ENABLE_SIGNUP=false
      - ENABLE_OAUTH_SIGNUP=true
      - WEBUI_ADMIN_EMAIL=${WEBUI_ADMIN_EMAIL}
      # Google OAuth (OIDC générique — utiliser OAUTH_CLIENT_ID et non GOOGLE_CLIENT_ID)
      - OAUTH_PROVIDER_NAME=Google
      - OPENID_PROVIDER_URL=https://accounts.google.com/.well-known/openid-configuration
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - OAUTH_REDIRECT_URI=https://chat.monolithoid.com/oauth/oidc/callback
      # Lie le compte Google à un compte existant avec le même email (évite "email déjà utilisé")
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true
      # Restreindre à un domaine Google spécifique (optionnel)
      # - GOOGLE_ALLOWED_DOMAINS=mondomaine.com
    depends_on:
      ollama:
        condition: service_started
      chromadb:
        condition: service_started
    networks:
      - ai-network

  # ----------------------------------------------------------
  # N8N — workflows et outils
  # Port interne : 5678
  # ⚠️  NON EXPOSÉ PUBLIQUEMENT — accès via tunnel SSH uniquement
  #
  # Pour accéder à l'interface depuis ton PC :
  #   ssh -L 5678:localhost:5678 user@monolithoid.com
  #   puis ouvrir : http://localhost:5678
  #
  # Si tu veux l'exposer publiquement plus tard (webhooks entrants) :
  #   1. Décommenter les lignes ports: ci-dessous
  #   2. Ajouter un sous-domaine n8n.monolithoid.com dans Coolify
  #   3. Retirer la règle : ufw deny 5678
  # ----------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    # ports:
    #   - "5678:5678"
    volumes:
      - /opt/ia/n8n:/home/node/.n8n
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    networks:
      - ai-network

  # ----------------------------------------------------------
  # CHROMADB — mémoire vectorielle
  # Port interne : 8000
  # Interne uniquement — ne jamais exposer publiquement
  # ----------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    restart: unless-stopped
    volumes:
      - /opt/ia/chroma:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - ai-network

  # ----------------------------------------------------------
  # BITTERBOT — agent IA local avec mémoire persistante
  # Port interne : 19001 (WebSocket + API OpenAI-compatible)
  # Accès : tunnel SSH uniquement → ssh -L 19001:localhost:19001 user@monolithoid.com
  #
  # Isolation réseau : bitterbot-net (internal: true)
  #   → Bitterbot n'a aucun accès internet (réseau Docker fermé)
  #   → Ollama est le seul service joignable (connecté aux deux réseaux)
  #
  # Composants désactivés :
  #   - Canaux messaging cloud (WhatsApp, Telegram, Discord, Signal, Slack)
  #   - Wallet USDC / x402 (wallet.enabled: false + réseau bloqué + pas de clé Stripe)
  #   - Marketplace P2P (discovery.enabled: false + port 9100 non exposé)
  #   - Onramp Stripe (BITTERBOT_ONRAMP_URL pointe vers loopback inexistant)
  #
  # Volumes :
  #   /opt/ia/bitterbot/config     → config, mémoire SQLite, état agent
  #   /opt/ia/bitterbot/workspace  → espace de travail de l'agent
  #   /opt/ia/sync/onedrive        → OneDrive synchronisé (lecture seule)
  #   /opt/ia/sync/gdrive          → Google Drive synchronisé (lecture seule)
  #
  # Dream Engine : actif par défaut (consolidation toutes les 2h)
  #   DB SQLite : /opt/ia/bitterbot/config/memory/memory.db
  #
  # Premier déploiement — exécuter sur le VPS AVANT docker compose up :
  #   mkdir -p /opt/ia/bitterbot/config /opt/ia/bitterbot/workspace
  #   mkdir -p /opt/ia/sync/onedrive /opt/ia/sync/gdrive
  #   cp core/bitterbot/bitterbot.json /opt/ia/bitterbot/config/bitterbot.json
  #   # Remplacer CHANGE_THIS_BITTERBOT_TOKEN dans le fichier copié
  #   chown -R 1000:1000 /opt/ia/bitterbot   # uid node dans le container
  #
  # Image Docker Hub : monolithoid/bitterbot:latest
  #   Publiée automatiquement chaque lundi par GitHub Actions.
  #   Mise à jour sur le VPS : docker compose pull bitterbot-gateway && docker compose up -d bitterbot-gateway
  #
  # Commande interactive CLI (à la demande) :
  #   docker compose run --rm bitterbot-cli
  # ----------------------------------------------------------
  bitterbot-gateway:
    # Image buildée par GitHub Actions et publiée sur Docker Hub.
    # Rebuild automatique chaque lundi → docker compose pull pour mettre à jour.
    # Workflow : .github/workflows/build-bitterbot.yml
    image: monolithoid/bitterbot:latest
    container_name: bitterbot-gateway
    restart: unless-stopped
    ports:
      # Lié uniquement au loopback — accès via tunnel SSH
      - "127.0.0.1:19001:19001"
    volumes:
      # Config + mémoire SQLite + état agent
      - /opt/ia/bitterbot/config:/home/node/.bitterbot
      # Workspace de l'agent
      - /opt/ia/bitterbot/workspace:/home/node/.bitterbot/workspace
      # Données cloud synchronisées — lecture seule
      - /opt/ia/sync/onedrive:/home/node/.bitterbot/workspace/onedrive:ro
      - /opt/ia/sync/gdrive:/home/node/.bitterbot/workspace/gdrive:ro
    environment:
      HOME: /home/node
      TERM: xterm-256color
      # Auth gateway — doit correspondre à gateway.auth.token dans bitterbot.json
      # Générer : openssl rand -hex 32
      BITTERBOT_GATEWAY_TOKEN: ${BITTERBOT_GATEWAY_TOKEN}
      # Inférence Ollama locale uniquement — aucune clé cloud (Anthropic/OpenAI/etc.)
      OLLAMA_API_KEY: "ollama-local"
      # Désactive l'initialisation des canaux messaging au démarrage
      BITTERBOT_SKIP_CHANNELS: "1"
      # Redirige l'onramp Stripe vers un endpoint inexistant (double sécurité wallet)
      BITTERBOT_ONRAMP_URL: "http://127.0.0.1:1/disabled"
    command:
      - "node"
      - "bitterbot.mjs"
      - "gateway"
      - "--bind"
      - "lan"
      - "--port"
      - "19001"
    depends_on:
      ollama:
        condition: service_started
    networks:
      # Réseau isolé sans accès internet (internal: true)
      - bitterbot-net

  # ----------------------------------------------------------
  # BITTERBOT CLI — accès interactif à la demande
  # Décommenter et lancer avec : docker compose run --rm bitterbot-cli
  # ----------------------------------------------------------
  # bitterbot-cli:
  #   image: bitterbot:local   # réutilise l'image buildée par bitterbot-gateway
  #   container_name: bitterbot-cli
  #   volumes:
  #     - /opt/ia/bitterbot/config:/home/node/.bitterbot
  #     - /opt/ia/bitterbot/workspace:/home/node/.bitterbot/workspace
  #     - /opt/ia/sync/onedrive:/home/node/.bitterbot/workspace/onedrive:ro
  #     - /opt/ia/sync/gdrive:/home/node/.bitterbot/workspace/gdrive:ro
  #   environment:
  #     HOME: /home/node
  #     TERM: xterm-256color
  #     BITTERBOT_GATEWAY_TOKEN: ${BITTERBOT_GATEWAY_TOKEN}
  #     BROWSER: echo
  #   stdin_open: true
  #   tty: true
  #   init: true
  #   entrypoint: ["node", "bitterbot.mjs"]
  #   networks:
  #     - bitterbot-net

  # ----------------------------------------------------------
  # ROS 2 JAZZY + ROSBRIDGE — hub WebSocket pour la robotique
  # Port interne : 9090  (WebSocket JSON rosbridge_suite)
  #
  # Le NAO se connecte EN SORTIE à ce port depuis le réseau du robot.
  # Toutes les commandes ROS transitent par ce serveur.
  # ----------------------------------------------------------
  ros2-bridge:
    build: ./robotics/ros2
    container_name: ros2-bridge
    restart: unless-stopped
    ports:
      # Exposé publiquement pour que NAO puisse se connecter depuis l'extérieur.
      - "9090:9090"
    networks:
      - ai-network
      - robotics-net

  # ----------------------------------------------------------
  # NAO GATEWAY — bridge HTTP (n8n) → rosbridge WebSocket
  # Port interne : 8001
  # Accès : tunnel SSH uniquement → ssh -L 8001:localhost:8001 user@monolithoid.com
  #
  # Variables à remplacer :
  #   GATEWAY_API_KEY : openssl rand -hex 32
  #     → À transmettre dans le header X-API-Key de chaque requête n8n
  #
  # Exemples de requêtes depuis n8n (HTTP Request node) :
  #   POST http://nao-gateway:8001/nao/say   {"text": "Bonjour"}
  #   POST http://nao-gateway:8001/nao/move  {"linear_x": 0.3}
  #   POST http://nao-gateway:8001/nao/stop
  #   GET  http://nao-gateway:8001/nao/status
  # ----------------------------------------------------------
  nao-gateway:
    build: ./robotics/nao/gateway
    container_name: nao-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - ROSBRIDGE_URL=ws://ros2-bridge:9090
      - GATEWAY_API_KEY=${GATEWAY_API_KEY}
    depends_on:
      ros2-bridge:
        condition: service_started
    networks:
      - ai-network
      - robotics-net

# ============================================================
# RÉSEAUX
#
# ai-network (bridge, accès internet) :
#   ollama, open-webui, n8n, chromadb
#   Les containers peuvent joindre internet pour mises à jour, webhooks n8n, etc.
#
# bitterbot-net (bridge, internal: true — aucun accès internet) :
#   bitterbot-gateway, ollama
#   Bitterbot est physiquement isolé : seul ollama est joignable.
#   Même si une lib tente un appel externe, Docker le bloque.
#
# Résolution DNS interne :
#   http://ollama:11434     (sur ai-network ET bitterbot-net)
#   http://chromadb:8000    (sur ai-network uniquement)
#   http://n8n:5678         (sur ai-network uniquement)
#   ws://bitterbot-gateway:19001  (sur bitterbot-net uniquement)
# ============================================================
networks:
  ai-network:
    driver: bridge

  # Réseau isolé pour Bitterbot — internal: true = aucune route vers internet
  bitterbot-net:
    driver: bridge
    internal: true

  # Réseau robotique — ros2-bridge + nao-gateway
  # Pas de internal: true car ros2-bridge doit être joignable par NAO depuis internet
  robotics-net:
    driver: bridge
