version: "3.8"

# ============================================================
# STACK IA — ${DOMAIN}
# ============================================================
# Exposé publiquement :
#   chat.${DOMAIN}   → Open WebUI  (port 3000)
#   ollama.${DOMAIN} → API Ollama  (port 11434)
#
# Services internes (tunnel SSH uniquement) :
#   n8n          → port 5678
#   bitterbot    → port 19001
#
# Données persistantes sous /opt/ia/ :
#   /opt/ia/ollama/              → modèles IA
#   /opt/ia/webui/               → agents, utilisateurs, historique
#   /opt/ia/n8n/                 → workflows
#   /opt/ia/chroma/              → base vectorielle
#   /opt/ia/bitterbot/           → mémoire SQLite, config agent
#   /opt/ia/nao/naoqi-sdk/       → SDK NAOqi Python 2.7 (fourni manuellement)
#   /opt/ia/whisper/             → modèles Whisper ASR (téléchargés au premier démarrage)
#
# Avant de déployer :
#   mkdir -p /opt/ia/{ollama,webui,n8n,chroma}
#   mkdir -p /opt/ia/bitterbot/{config,workspace}
#   mkdir -p /opt/ia/nao/naoqi-sdk
#   mkdir -p /opt/ia/nao/persona
#   mkdir -p /opt/ia/whisper
#   cp core/bitterbot/bitterbot.json /opt/ia/bitterbot/config/bitterbot.json
#   # Extraire le SDK NAOqi Python 2.7 dans /opt/ia/nao/naoqi-sdk/
#   # (pynaoqi-python2.7-2.1.4.*-linux64.tar.gz depuis le portail SoftBank)
#
# Variables à configurer dans Coolify → Environment Variables :
#   DOMAIN                   : ton domaine (ex: mon-domain.com)
#   DOCKERHUB_USERNAME       : ton username Docker Hub
#   OLLAMA_API_KEYS          : openssl rand -hex 32
#   WEBUI_SECRET_KEY         : openssl rand -hex 32
#   N8N_BASIC_AUTH_PASSWORD  : mot de passe de ton choix
#   OAUTH_CLIENT_ID          : Google Cloud Console → OAuth 2.0
#   OAUTH_CLIENT_SECRET      : idem
#   BITTERBOT_GATEWAY_TOKEN  : openssl rand -hex 32
#   ROSBRIDGE_TOKEN          : openssl rand -hex 32 (jeton exigé par rosbridge-proxy,
#                              à passer aussi au NAO : nao_ws_bridge.py --token)
#   NAO_ROBOT_ID             : nao_01 (identifiant ROS2 du corps)
#   NAO_MOTION_LIMITS        : JSON des décisions de mouvement du driver NAO (défaut: vide,
#                              ex. {"rest_delay": 5}, cf. docs/nao.md « Motion decisions »)
#   STATIC_DRONE_ID          : static_01 (identifiant ROS2 du drone statique, ADR 004)
#   NAO_HEAD_YAW_OFFSET      : décalage en degrés pour tourner la tête du NAO vers la voix
#                              entendue par le drone statique (défaut: 0)
#   NAO_SPEAKING_SYNC        : 1 = le NAO s'anime pendant que le drone statique parle,
#                              0 = désactivé (défaut: 1)
#   LISTEN_DURATION          : durée d'écoute après wake word en secondes (défaut: 4.0)
#   ASR_MODEL                : modèle Whisper — tiny/base/small (défaut: small)
#
# Twitch et voix du stream (ADR 005) :
#   TWITCH_CHANNEL           : chaîne dont on lit le tchat (ex: monolithoid)
#   TWITCH_USER_COOLDOWN_S   : délai entre deux messages acceptés d'un spectateur (défaut: 30)
#   TWITCH_BLOCKLIST         : mots interdits séparés par des virgules (défaut: vide)
#   TWITCH_MODS_ONLY         : 1 = seuls modérateurs et streamer peuvent appeler !nao (défaut: 0)
#   OBS_DRONE_ID             : obs_01 (identifiant ROS2 de la voix du stream)
#   OBS_TOKEN                : openssl rand -hex 32 (secret de l'URL de l'overlay OBS)
#   REGIE_TOKEN              : openssl rand -hex 32 (secret de l'URL de la régie)
#
# Cerveau de body-gateway (voir docs/ia-stack.md, « Fournisseur du cerveau ») :
#   BRAIN_PROVIDER           : ollama (défaut) | openai | anthropic
#   BRAIN_URL                : vide = défaut du fournisseur (Ollama : http://localhost:11434)
#   BRAIN_MODEL              : vide = qwen3:1.7b / gpt-4o-mini / claude-haiku-4-5
#   BRAIN_API_KEY            : clé du fournisseur (défaut : OLLAMA_API_KEYS)
#   BRAIN_EFFORT             : Anthropic uniquement, optionnel (low/medium/high)
#   Personnalité de NAO      : /opt/ia/nao/persona/personnalite.md (absent = texte par défaut)
#
# Firewall (ports exposés publiquement) :
#   ufw allow 22
#   ufw allow 80
#   ufw allow 443
#   ufw deny 11434
#   ufw deny 3000
#   ufw deny 5678
#   ufw allow from 172.16.0.0/12 to any port 9090   # rosbridge-proxy (Docker bridge) → ros2-bridge
#   ufw deny 9090    # rosbridge passe par Traefik + rosbridge-proxy (jeton), jamais en direct
#   ufw enable
# ============================================================

services:

  # ----------------------------------------------------------
  # OLLAMA — moteur LLM
  # ----------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - /opt/ia/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_NUM_THREAD=8
      - OLLAMA_API_KEYS=${OLLAMA_API_KEYS}
    networks:
      - ai-network
      - bitterbot-net

  # ----------------------------------------------------------
  # OPEN WEBUI — interface agents
  # Accès via Google SSO uniquement (ENABLE_SIGNUP=false)
  # ----------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - /opt/ia/webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_API_KEY=${OLLAMA_API_KEYS}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - CHROMA_HTTP_HOST=chromadb
      - CHROMA_HTTP_PORT=8000
      - DEFAULT_MODELS=${DEFAULT_MODELS:-nao_brain}
      - ENABLE_SIGNUP=false
      - ENABLE_OAUTH_SIGNUP=true
      - ENABLE_API_KEY=true
      - WEBUI_ADMIN_EMAIL=${WEBUI_ADMIN_EMAIL}
      - OAUTH_PROVIDER_NAME=Google
      - OPENID_PROVIDER_URL=https://accounts.google.com/.well-known/openid-configuration
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - OAUTH_REDIRECT_URI=https://chat.${DOMAIN}/oauth/oidc/callback
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true
    depends_on:
      ollama:
        condition: service_started
      chromadb:
        condition: service_started
    networks:
      - ai-network

  # ----------------------------------------------------------
  # N8N — workflows
  # Accès via tunnel SSH : ssh -L 5678:localhost:5678 $VPS_USER@${DOMAIN}
  # ----------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    volumes:
      - /opt/ia/n8n:/home/node/.n8n
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    networks:
      - ai-network

  # ----------------------------------------------------------
  # CHROMADB — mémoire vectorielle
  # Interne uniquement — ne jamais exposer publiquement
  # ----------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    restart: unless-stopped
    volumes:
      - /opt/ia/chroma:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - ai-network

  # ----------------------------------------------------------
  # BITTERBOT — cerveau de NAO (désactivé — voir ADR 003)
  #
  # Bitterbot ajoute mémoire long-terme et dream engine, mais son API
  # /v1/chat/completions n'était pas stable. body-gateway appelle
  # désormais Ollama directement (BRAIN_URL=http://localhost:11434).
  #
  # Pour réactiver : décommenter ce bloc, retirer la dépendance
  # bitterbot-net ci-dessous et changer BRAIN_URL dans body-gateway.
  # ----------------------------------------------------------
  # bitterbot-gateway:
  #   image: ${DOCKERHUB_USERNAME}/bitterbot:latest
  #   container_name: bitterbot-gateway
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:19001:19001"
  #   volumes:
  #     - /opt/ia/bitterbot/config:/home/node/.bitterbot
  #     - /opt/ia/bitterbot/workspace:/home/node/.bitterbot/workspace
  #   environment:
  #     HOME: /home/node
  #     TERM: xterm-256color
  #     BITTERBOT_GATEWAY_TOKEN: ${BITTERBOT_GATEWAY_TOKEN}
  #     OLLAMA_API_KEY: "ollama-local"
  #     BITTERBOT_SKIP_CHANNELS: "1"
  #     BITTERBOT_ONRAMP_URL: "http://127.0.0.1:1/disabled"
  #   command: ["node", "bitterbot.mjs", "gateway", "--bind", "lan", "--port", "19001"]
  #   depends_on:
  #     ollama:
  #       condition: service_started
  #   networks:
  #     - bitterbot-net

  # ----------------------------------------------------------
  # CORPS NAO — couche physique ROS2 Humble
  #
  # Services du pont cerveau → corps :
  #
  #   naoqi-driver       → Nœud ROS2, relaie /bodies/{id}/actuators/* et
  #                         /naoqi/* vers /nao/* (rosbridge → nao_ws_bridge).
  #                         NAO initie la connexion WebSocket sortante —
  #                         aucune adresse IP ni port du robot requis côté VPS.
  #   static-driver      → Nœud ROS2 (même conteneur nao-core), relaie
  #                         /drones/{id}/* (drone statique, ADR 004) ↔ /bodies/{id}/*
  #                         avec Whisper STT et edge-tts. Lancé une 2e fois
  #                         avec OBS_DRONE_ID pour la voix du stream (ADR 005).
  #   cognitive-renderer → Nœud ROS2, /cognitive_state → LEDs + tête en continu
  #   body-gateway       → Nœud ROS2, pont LLM (BRAIN_PROVIDER) ↔ bus ROS2
  #                         Injecte un system prompt JSON lors de chaque appel
  #                         Gère les ticks oniriques (DREAMING 2h-6h)
  #
  # Réseau : network_mode host pour les nœuds ROS2 (DDS domain 42)
  #
  # Multi-corps : ajouter un driver par robot/drone avec un identifiant
  # distinct, et ajouter l'ID dans BODY_REGISTRY (les ID « static… » sont
  # des drones statiques, « obs… » la voix du stream, les autres des NAO).
  # ----------------------------------------------------------

  # ----------------------------------------------------------
  # WHISPER ASR — transcription vocale (STT)
  #
  # Reçoit des fichiers WAV depuis naoqi-driver et retourne
  # le texte transcrit.  Modèle "small" (461 MB) est un bon
  # compromis vitesse/précision pour le français sur CPU.
  #
  # Accès interne uniquement (127.0.0.1:9000).
  # Premier démarrage : téléchargement du modèle (~460 MB).
  # ----------------------------------------------------------
  whisper-asr:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: whisper-asr
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - /opt/ia/whisper:/root/.cache/whisper
    environment:
      - ASR_MODEL=${ASR_MODEL:-small}
      - ASR_LANGUAGE=fr
    networks:
      - ai-network

  # ----------------------------------------------------------
  # NAOQI BRIDGE — HTTP bridge Python 2.7 vers le SDK qi
  #
  # Fournit une API REST locale pour diagnostiquer et tester
  # chaque capacité NAOqi (/say, /motion, /leds, /posture,
  # /move, /battery, /events) sans avoir à publier sur le bus ROS2.
  #
  # En fonctionnement normal (outbound WS), le bridge tourne en
  # mode mock (connected=false) — aucune connexion directe au NAO
  # n'est requise côté VPS.  Le vrai chemin de commandes passe par
  # rosbridge → nao_ws_bridge (embarqué sur le robot).
  #
  # Accès local uniquement : 127.0.0.1:8090 sur le host
  # (accessible depuis naoqi-driver en network_mode: host via
  # http://localhost:8090 et depuis ai-network via naoqi-bridge:8090)
  # ----------------------------------------------------------
  naoqi-bridge:
    image: ${DOCKERHUB_USERNAME}/naoqi-bridge:latest
    container_name: naoqi-bridge
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - /opt/ia/nao/naoqi-sdk:/opt/naoqi-sdk
    environment:
      - BRIDGE_PORT=8090
      - RECONNECT_INTERVAL=15
      - ROSBRIDGE_URL=ws://rosbridge-proxy:80
      - ROSBRIDGE_TOKEN=${ROSBRIDGE_TOKEN:-}
    networks:
      - ai-network
      - robotics-net

  nao-core:
    image: ${DOCKERHUB_USERNAME}/nao-core:latest
    container_name: nao-core
    restart: unless-stopped
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - PYTHONUNBUFFERED=1
      - ROBOT_ID=${NAO_ROBOT_ID:-nao_01}
      - WHISPER_URL=http://localhost:9000
      - LISTEN_DURATION=${LISTEN_DURATION:-4.0}
      - NAO_STATUS_TIMEOUT=${NAO_STATUS_TIMEOUT:-90}
      - MOTION_LIMITS=${NAO_MOTION_LIMITS:-}
      - TTS_VOICE=${TTS_VOICE:-fr-FR-DeniseNeural}
      - DRONE_ID=${STATIC_DRONE_ID:-static_01}
      - DRONE_STATUS_TIMEOUT=${DRONE_STATUS_TIMEOUT:-90}
      - SPEAKING_SYNC=${NAO_SPEAKING_SYNC:-1}
      - OBS_DRONE_ID=${OBS_DRONE_ID:-obs_01}
      # Univers moteur contraint : bras seulement sur ordre du LLM, motion-engine coupé.
      - RENDERER_ARMS=${NAO_RENDERER_ARMS:-0}
      - MOTION_ENGINE=${NAO_MOTION_ENGINE:-0}
    depends_on:
      whisper-asr:
        condition: service_started

  body-gateway:
    image: ${DOCKERHUB_USERNAME}/body-gateway:latest
    container_name: body-gateway
    restart: unless-stopped
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - TZ=${TZ:-Europe/Paris}
      - BRAIN_PROVIDER=${BRAIN_PROVIDER:-ollama}
      # Vides par défaut : body-gateway prend alors les valeurs du fournisseur.
      - BRAIN_URL=${BRAIN_URL:-}
      - BRAIN_MODEL=${BRAIN_MODEL:-}
      - BRAIN_API_KEY=${BRAIN_API_KEY:-${OLLAMA_API_KEYS}}
      - BRAIN_EFFORT=${BRAIN_EFFORT:-}
      - BRAIN_PERSONA_FILE=/opt/nao/persona/personnalite.md
      - BODY_REGISTRY=${NAO_ROBOT_ID:-nao_01},${STATIC_DRONE_ID:-static_01},${OBS_DRONE_ID:-obs_01}
      - DREAMING_HOUR_START=${DREAMING_HOUR_START:-2}
      - DREAMING_HOUR_END=${DREAMING_HOUR_END:-6}
      - DREAMING_BATTERY_THRESHOLD=${DREAMING_BATTERY_THRESHOLD:-80.0}
      - DREAM_TICK_INTERVAL=${DREAM_TICK_INTERVAL:-300}
      - BRAIN_TIMEOUT=${BRAIN_TIMEOUT:-60}
      - CHAT_PORT=8095
      - WAKE_WORD=${WAKE_WORD:-ok nao}
      - WAKE_WINDOW_S=${WAKE_WINDOW_S:-10}
      - NAO_HEAD_YAW_OFFSET=${NAO_HEAD_YAW_OFFSET:-0}
      - WEBUI_URL=${WEBUI_URL:-http://localhost:3000}
      - WEBUI_API_KEY=${WEBUI_API_KEY:-}
      - WEBUI_PIPE_MODEL=${WEBUI_PIPE_MODEL:-nao_brain}
      - WEBUI_VOICE_CHAT_ID=${WEBUI_VOICE_CHAT_ID:-}
    volumes:
      # Personnalité de NAO, relue à chaque appel du LLM (persona.py)
      - /opt/ia/nao/persona:/opt/nao/persona:ro
    depends_on:
      nao-core:
        condition: service_started

  # ----------------------------------------------------------
  # ROS 2 BRIDGE — WebSocket rosbridge pour le script NAO
  #
  # ros2-bridge tourne en network_mode: host pour partager le
  # domaine DDS 42 avec les autres nœuds ROS2
  # ----------------------------------------------------------
  ros2-bridge:
    image: ${DOCKERHUB_USERNAME}/ros2-bridge:latest
    container_name: ros2-bridge
    restart: unless-stopped
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp

  # Seul point d'entrée public de rosbridge. Caddy n'accepte une connexion
  # que si elle porte l'en-tête « Authorization: Bearer $ROSBRIDGE_TOKEN »,
  # sinon il répond 401. Sans jeton configuré, le conteneur refuse de démarrer.
  #
  # Domaine : à choisir dans Coolify (champ Domains du service), en https://
  # sur le port 80 du conteneur, ex. https://rosbridge.${DOMAIN}. TLS uniquement.
  # Le NAO, dont le Python 2.7 ne sait pas faire de TLS, passe par le relais
  # du drone statique (ADR 006) : plus de rosbridge en HTTP clair.
  rosbridge-proxy:
    image: caddy:alpine
    container_name: rosbridge-proxy
    restart: unless-stopped
    environment:
      - ROSBRIDGE_TOKEN=${ROSBRIDGE_TOKEN:-}
    command:
      - sh
      - -c
      - |-
          if [ -z "$$ROSBRIDGE_TOKEN" ]; then
            echo "[rosbridge-proxy] ERREUR : ROSBRIDGE_TOKEN non défini" >&2
            exit 1
          fi
          hex=$$(awk 'NR>1 && $$2=="00000000" {print $$3; exit}' /proc/net/route)
          if [ -z "$$hex" ]; then
            echo "[rosbridge-proxy] ERREUR : aucune route par défaut dans /proc/net/route" >&2
            exit 1
          fi
          gw=$$(printf '%d.%d.%d.%d' \
            "0x$${hex:6:2}" "0x$${hex:4:2}" "0x$${hex:2:2}" "0x$${hex:0:2}")
          echo "[rosbridge-proxy] gateway hôte détecté : $$gw"
          export ROSBRIDGE_UPSTREAM="$$gw:9090"
          cat > /etc/caddy/Caddyfile <<'EOF'
          {
          	admin off
          }
          :80 {
          	@authorized header Authorization "Bearer {$$ROSBRIDGE_TOKEN}"
          	handle @authorized {
          		reverse_proxy {$$ROSBRIDGE_UPSTREAM}
          	}
          	handle {
          		respond 401
          	}
          }
          EOF
          exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    networks:
      - robotics-net
    depends_on:
      - ros2-bridge

  # ----------------------------------------------------------
  # CHAT RELAY — pont WebUI ↔ body-gateway (HTTP)
  #
  # body-gateway tourne en network_mode: host (nécessaire pour ROS2 DDS)
  # et ne peut donc pas être directement sur ai-network.
  # Ce proxy Caddy fait le pont : open-webui l'atteint via chat-relay:8095,
  # et lui-même relaie vers l'IP gateway du réseau hôte détectée au démarrage.
  #
  # On n'utilise PAS extra_hosts/host-gateway : ce mécanisme Docker 20.10+
  # ne fonctionne pas dans certains environnements Coolify.
  # À la place, on lit /proc/net/route (route par défaut) pour obtenir
  # l'IP passerelle du bridge Docker — universellement disponible.
  # ----------------------------------------------------------
  chat-relay:
    image: caddy:alpine
    container_name: chat-relay
    restart: unless-stopped
    command:
      - sh
      - -c
      - |-
          hex=$$(awk 'NR>1 && $$2=="00000000" {print $$3; exit}' /proc/net/route)
          if [ -z "$$hex" ]; then
            echo "[chat-relay] ERREUR : aucune route par défaut dans /proc/net/route" >&2
            exit 1
          fi
          gw=$$(printf '%d.%d.%d.%d' \
            "0x$${hex:6:2}" "0x$${hex:4:2}" "0x$${hex:2:2}" "0x$${hex:0:2}")
          echo "[chat-relay] gateway hôte détecté : $$gw"
          exec caddy reverse-proxy --from :8095 --to "$$gw:8095"
    networks:
      - ai-network
    depends_on:
      - body-gateway

  # ----------------------------------------------------------
  # ENTRÉE TWITCH — une stimulation extérieure de plus (ADR 005)
  #
  # Comme « ok nao » ou un message Open WebUI : les messages « !nao … »
  # du tchat (lecture anonyme, aucun jeton Twitch) deviennent un texte
  # envoyé à body-gateway /chat. Le cerveau renvoie la liste d'actions
  # et la répartit lui-même sur les corps (NAO, voix de la pièce, voix
  # du stream). Sans TWITCH_CHANNEL, le conteneur refuse de démarrer.
  # ----------------------------------------------------------
  twitch-input:
    image: ${DOCKERHUB_USERNAME}/twitch-input:latest
    container_name: twitch-input
    restart: unless-stopped
    environment:
      - TWITCH_CHANNEL=${TWITCH_CHANNEL:-}
      - BODY_GATEWAY_URL=http://chat-relay:8095
      - ROBOT_ID=${NAO_ROBOT_ID:-nao_01}
      - COMMAND_PREFIX=${TWITCH_COMMAND_PREFIX:-!nao}
      - USER_COOLDOWN_S=${TWITCH_USER_COOLDOWN_S:-30}
      - MIN_INTERVAL_S=${TWITCH_MIN_INTERVAL_S:-5}
      - BLOCKLIST=${TWITCH_BLOCKLIST:-}
      - MODS_ONLY=${TWITCH_MODS_ONLY:-0}
    networks:
      - ai-network
    depends_on:
      - chat-relay

  # ----------------------------------------------------------
  # AGENT OBS — voix de NAO sur le stream (ADR 005)
  #
  # Corps « voix » comme le haut-parleur du drone statique : il se
  # connecte à rosbridge (jeton), et static-driver (lancé une 2e fois
  # dans nao-core avec OBS_DRONE_ID) fait la synthèse edge-tts.
  # Domaine : à choisir dans Coolify (champ Domains du service), avec le
  # port du conteneur, ex. https://obs.${DOMAIN}:8096.
  # La voix arrive dans le mixer OBS par une source navigateur :
  #   https://<domaine obs-agent>/overlay?token=$OBS_TOKEN
  #   (cocher « Contrôler l'audio via OBS »)
  # Il n'est « connecté » (et ne reçoit la parole) que tant que
  # l'overlay est ouvert dans OBS.
  # ----------------------------------------------------------
  obs-agent:
    image: ${DOCKERHUB_USERNAME}/obs-agent:latest
    container_name: obs-agent
    restart: unless-stopped
    environment:
      - DRONE_ID=${OBS_DRONE_ID:-obs_01}
      - ROSBRIDGE_URL=ws://rosbridge-proxy:80
      - ROSBRIDGE_TOKEN=${ROSBRIDGE_TOKEN:-}
      - OBS_TOKEN=${OBS_TOKEN:-}
    networks:
      - robotics-net
    depends_on:
      - rosbridge-proxy

  # ----------------------------------------------------------
  # RÉGIE — suivre les flux entre les composants (ADR 007)
  #
  # body-gateway publie chaque entrée, décision du LLM et action
  # routée sur le topic ROS /events. La régie le lit par rosbridge
  # (jeton) et l'affiche en direct :
  #   https://<domaine regie>/?token=$REGIE_TOKEN
  # Page Robot (seule à écrire, sur /nao/calibration et /nao/components) :
  # calibrage du profil moteur et composants NAOqi du NAO.
  #   https://<domaine regie>/robot?token=$REGIE_TOKEN
  # Domaine : à choisir dans Coolify (champ Domains du service), avec le
  # port du conteneur, ex. https://regie.${DOMAIN}:8097.
  # Lichtblick, rqt ou `ros2 topic echo /events` lisent le même topic.
  # ----------------------------------------------------------
  regie:
    image: ${DOCKERHUB_USERNAME}/regie:latest
    container_name: regie
    restart: unless-stopped
    environment:
      - ROSBRIDGE_URL=ws://rosbridge-proxy:80
      - ROSBRIDGE_TOKEN=${ROSBRIDGE_TOKEN:-}
      - REGIE_TOKEN=${REGIE_TOKEN:-}
    networks:
      - robotics-net
    depends_on:
      - rosbridge-proxy

# ============================================================
# RÉSEAUX
#
# ai-network (bridge, accès internet) :
#   ollama, open-webui, n8n, chromadb, whisper-asr, naoqi-bridge,
#   chat-relay, twitch-input
#
# bitterbot-net (bridge, internal: true — aucun accès internet) :
#   bitterbot-gateway, ollama
#   Bitterbot ne peut joindre qu'Ollama — tout accès externe est bloqué.
#
# robotics-net (bridge, accès internet) :
#   rosbridge-proxy — proxy WebSocket Caddy vers ros2-bridge (host)
#   naoqi-bridge, obs-agent, regie — clients de rosbridge-proxy (jeton)
#
# Nœuds ROS2 (ros2-bridge, nao-core, body-gateway) :
#   network_mode: host — DDS ROS2 Humble (domain 42) sur le réseau hôte.
# ============================================================
networks:
  ai-network:
    driver: bridge

  bitterbot-net:
    driver: bridge
    internal: true

  robotics-net:
    driver: bridge
