version: "3.8"

# ============================================================
# STACK IA — ${DOMAIN}
# ============================================================
# Exposé publiquement :
#   chat.${DOMAIN}   → Open WebUI  (port 3000)
#   ollama.${DOMAIN} → API Ollama  (port 11434)
#
# Services internes (tunnel SSH uniquement) :
#   n8n          → port 5678
#   bitterbot    → port 19001
#
# Données persistantes sous /opt/ia/ :
#   /opt/ia/ollama/              → modèles IA
#   /opt/ia/webui/               → agents, utilisateurs, historique
#   /opt/ia/n8n/                 → workflows
#   /opt/ia/chroma/              → base vectorielle
#   /opt/ia/bitterbot/           → mémoire SQLite, config agent
#   /opt/ia/nao/naoqi-sdk/       → SDK NAOqi Python 2.7 (fourni manuellement)
#
# Avant de déployer :
#   mkdir -p /opt/ia/{ollama,webui,n8n,chroma}
#   mkdir -p /opt/ia/bitterbot/{config,workspace}
#   mkdir -p /opt/ia/nao/naoqi-sdk
#   cp core/bitterbot/bitterbot.json /opt/ia/bitterbot/config/bitterbot.json
#   # Extraire le SDK NAOqi Python 2.7 dans /opt/ia/nao/naoqi-sdk/
#   # (pynaoqi-python2.7-2.1.4.*-linux64.tar.gz depuis le portail SoftBank)
#
# Variables à configurer dans Coolify → Environment Variables :
#   DOMAIN                   : ton domaine (ex: mon-domain.com)
#   DOCKERHUB_USERNAME       : ton username Docker Hub
#   ROSBRIDGE_DOMAIN         : sous-domaine rosbridge (ex: rosbridge.mon-domain.com)
#   OLLAMA_API_KEYS          : openssl rand -hex 32
#   WEBUI_SECRET_KEY         : openssl rand -hex 32
#   N8N_BASIC_AUTH_PASSWORD  : mot de passe de ton choix
#   OAUTH_CLIENT_ID          : Google Cloud Console → OAuth 2.0
#   OAUTH_CLIENT_SECRET      : idem
#   BITTERBOT_GATEWAY_TOKEN  : openssl rand -hex 32
#   GATEWAY_API_KEY          : openssl rand -hex 32
#   NAO_IP                   : adresse IP du robot NAO
#   NAO_PORT                 : 9559 (défaut NAOqi)
#   NAO_ROBOT_ID             : nao_01 (identifiant ROS2 du corps)
#
# Firewall (ports exposés publiquement) :
#   ufw allow 22
#   ufw allow 80
#   ufw allow 443
#   ufw deny 11434
#   ufw deny 3000
#   ufw deny 5678
#   ufw deny 9090    # rosbridge passe par Traefik (wss://), port 9090 non exposé
#   ufw enable
# ============================================================

services:

  # ----------------------------------------------------------
  # OLLAMA — moteur LLM
  # ----------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - /opt/ia/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_NUM_THREAD=8
      - OLLAMA_API_KEYS=${OLLAMA_API_KEYS}
    networks:
      - ai-network
      - bitterbot-net

  # ----------------------------------------------------------
  # OPEN WEBUI — interface agents
  # Accès via Google SSO uniquement (ENABLE_SIGNUP=false)
  # ----------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - /opt/ia/webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_API_KEY=${OLLAMA_API_KEYS}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - CHROMA_HTTP_HOST=chromadb
      - CHROMA_HTTP_PORT=8000
      - DEFAULT_MODELS=qwen3:8b
      - ENABLE_SIGNUP=false
      - ENABLE_OAUTH_SIGNUP=true
      - WEBUI_ADMIN_EMAIL=${WEBUI_ADMIN_EMAIL}
      - OAUTH_PROVIDER_NAME=Google
      - OPENID_PROVIDER_URL=https://accounts.google.com/.well-known/openid-configuration
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - OAUTH_REDIRECT_URI=https://chat.${DOMAIN}/oauth/oidc/callback
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true
    depends_on:
      ollama:
        condition: service_started
      chromadb:
        condition: service_started
    networks:
      - ai-network

  # ----------------------------------------------------------
  # N8N — workflows
  # Accès via tunnel SSH : ssh -L 5678:localhost:5678 $VPS_USER@${DOMAIN}
  # ----------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    volumes:
      - /opt/ia/n8n:/home/node/.n8n
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    networks:
      - ai-network

  # ----------------------------------------------------------
  # CHROMADB — mémoire vectorielle
  # Interne uniquement — ne jamais exposer publiquement
  # ----------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    restart: unless-stopped
    volumes:
      - /opt/ia/chroma:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - ai-network

  # ----------------------------------------------------------
  # BITTERBOT — cerveau de NAO
  # Agent IA local : Qwen3 via Ollama, Dream Engine intégré (2h),
  # mémoire SQLite persistante.
  #
  # Isolation réseau : bitterbot-net (internal: true)
  #   → seul Ollama est joignable, aucun accès internet
  #
  # Accès via tunnel SSH : ssh -L 19001:localhost:19001 $VPS_USER@${DOMAIN}
  #
  # Premier déploiement :
  #   cp core/bitterbot/bitterbot.json /opt/ia/bitterbot/config/bitterbot.json
  #   sed -i 's/CHANGE_THIS_BITTERBOT_TOKEN/${BITTERBOT_GATEWAY_TOKEN}/' \
  #       /opt/ia/bitterbot/config/bitterbot.json
  #   chown -R 1000:1000 /opt/ia/bitterbot
  # ----------------------------------------------------------
  bitterbot-gateway:
    image: ${DOCKERHUB_USERNAME}/bitterbot:latest
    container_name: bitterbot-gateway
    profiles: ["bitterbot"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:19001:19001"
    volumes:
      - /opt/ia/bitterbot/config:/home/node/.bitterbot
      - /opt/ia/bitterbot/workspace:/home/node/.bitterbot/workspace
    environment:
      HOME: /home/node
      TERM: xterm-256color
      BITTERBOT_GATEWAY_TOKEN: ${BITTERBOT_GATEWAY_TOKEN}
      OLLAMA_API_KEY: "ollama-local"
      BITTERBOT_SKIP_CHANNELS: "1"
      BITTERBOT_ONRAMP_URL: "http://127.0.0.1:1/disabled"
    command: ["node", "bitterbot.mjs", "gateway", "--bind", "lan", "--port", "19001"]
    depends_on:
      ollama:
        condition: service_started
    networks:
      - bitterbot-net

  # ----------------------------------------------------------
  # CORPS NAO — couche physique ROS2 Humble
  #
  # Quatre services forment le pont cerveau → corps :
  #
  #   naoqi-bridge       → Python 2.7 + qi SDK, parle à NAO via TCP:9559
  #                         Expose HTTP/SSE sur 127.0.0.1:8090
  #   naoqi-driver       → Nœud ROS2, traduit /bodies/{id}/sensors|actuators/*
  #                         Un nœud par corps physique (ROBOT_ID)
  #   cognitive-renderer → Nœud ROS2, /cognitive_state → LEDs + tête en continu
  #   body-gateway       → Nœud ROS2, pont Bitterbot ↔ bus ROS2
  #                         Injecte un system prompt JSON lors de chaque appel
  #                         Gère les ticks oniriques (DREAMING 2h-6h)
  #
  # Réseau : network_mode host pour les nœuds ROS2 (DDS domain 42)
  #   → Bitterbot joignable sur localhost:19001
  #   → naoqi-bridge joignable sur localhost:8090
  #
  # Multi-corps futur : ajouter un naoqi-bridge + naoqi-driver par robot/drone
  # avec un ROBOT_ID distinct, et ajouter l'ID dans BODY_REGISTRY.
  # ----------------------------------------------------------

  naoqi-bridge:
    build: ./robotics/nao_brain/naoqi_bridge
    image: ${DOCKERHUB_USERNAME}/naoqi-bridge:latest
    container_name: naoqi-bridge
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - /opt/ia/nao/naoqi-sdk:/opt/naoqi-sdk:ro
    environment:
      - NAO_IP=${NAO_IP}
      - NAO_PORT=${NAO_PORT:-9559}
      - BRIDGE_PORT=8090
    networks:
      - ai-network

  naoqi-driver:
    build: ./robotics/nao_brain/naoqi_driver
    image: ${DOCKERHUB_USERNAME}/naoqi-driver:latest
    container_name: naoqi-driver
    restart: unless-stopped
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=42
      - ROBOT_ID=${NAO_ROBOT_ID:-nao_01}
      - NAOQI_BRIDGE_URL=http://localhost:8090
    depends_on:
      naoqi-bridge:
        condition: service_started

  cognitive-renderer:
    build: ./robotics/nao_brain/cognitive_renderer
    image: ${DOCKERHUB_USERNAME}/cognitive-renderer:latest
    container_name: cognitive-renderer
    restart: unless-stopped
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=42
    depends_on:
      naoqi-driver:
        condition: service_started

  body-gateway:
    build: ./robotics/nao_brain/body_gateway
    image: ${DOCKERHUB_USERNAME}/body-gateway:latest
    container_name: body-gateway
    restart: unless-stopped
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=42
      - BITTERBOT_URL=http://localhost:19001
      - BITTERBOT_GATEWAY_TOKEN=${BITTERBOT_GATEWAY_TOKEN}
      - BODY_REGISTRY=${NAO_ROBOT_ID:-nao_01}
      - DREAMING_HOUR_START=${DREAMING_HOUR_START:-2}
      - DREAMING_HOUR_END=${DREAMING_HOUR_END:-6}
      - DREAMING_BATTERY_THRESHOLD=${DREAMING_BATTERY_THRESHOLD:-80.0}
      - DREAM_TICK_INTERVAL=${DREAM_TICK_INTERVAL:-300}
    depends_on:
      bitterbot-gateway:
        condition: service_started
      naoqi-driver:
        condition: service_started
      cognitive-renderer:
        condition: service_started

  # ----------------------------------------------------------
  # ROS 2 BRIDGE — WebSocket rosbridge pour le script NAO
  #
  # ros2-bridge tourne en network_mode: host pour partager le
  # domaine DDS 42 avec les autres nœuds ROS2 (naoqi-driver, etc.)
  #
  # rosbridge-proxy (Caddy) est sur le réseau Docker pour que
  # Traefik puisse le router :
  #   wss://rosbridge.$DOMAIN → Traefik (TLS) → Caddy (port 80)
  #                           → host-gateway:9090 (ros2-bridge)
  # ----------------------------------------------------------
  ros2-bridge:
    image: ${DOCKERHUB_USERNAME}/ros2-bridge:latest
    container_name: ros2-bridge
    restart: unless-stopped
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=42

  rosbridge-proxy:
    image: caddy:alpine
    container_name: rosbridge-proxy
    restart: unless-stopped
    command: caddy reverse-proxy --from :80 --to host-gateway:9090
    extra_hosts:
      - "host-gateway:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rosbridge.rule=Host(`rosbridge.${DOMAIN}`)"
      - "traefik.http.routers.rosbridge.entrypoints=https"
      - "traefik.http.routers.rosbridge.tls.certresolver=letsencrypt"
      - "traefik.http.services.rosbridge.loadbalancer.server.port=80"
    networks:
      - robotics-net
    depends_on:
      - ros2-bridge

# ============================================================
# RÉSEAUX
#
# ai-network (bridge, accès internet) :
#   ollama, open-webui, n8n, chromadb, naoqi-bridge
#
# bitterbot-net (bridge, internal: true — aucun accès internet) :
#   bitterbot-gateway, ollama
#   Bitterbot ne peut joindre qu'Ollama — tout accès externe est bloqué.
#
# robotics-net (bridge, accès internet) :
#   rosbridge-proxy — proxy WebSocket Caddy vers ros2-bridge (host)
#
# Nœuds ROS2 (ros2-bridge, naoqi-driver, cognitive-renderer, body-gateway) :
#   network_mode: host — DDS ROS2 Humble (domain 42) sur le réseau hôte.
# ============================================================
networks:
  ai-network:
    driver: bridge

  bitterbot-net:
    driver: bridge
    internal: true

  robotics-net:
    driver: bridge
