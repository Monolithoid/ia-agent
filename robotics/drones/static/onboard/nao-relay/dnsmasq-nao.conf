# DHCP du câble NAO ↔ drone (ADR 006), à copier dans /etc/dnsmasq.d/.
# Remplacer eth0 par le nom de l'interface Ethernet du drone (ip link).
# Le NAO reçoit 192.168.50.2 sans passerelle ni DNS : il ne voit que le drone.

# Pas de serveur DNS (évite le conflit avec systemd-resolved sur Ubuntu)
port=0
interface=eth0
# bind-dynamic : démarre même si le câble n'est pas encore branché
bind-dynamic
dhcp-range=192.168.50.2,192.168.50.2,255.255.255.0,12h
# Pas de passerelle (option 3) ni de DNS (option 6)
dhcp-option=3
dhcp-option=6
# Heure : serveur NTP (chrony) du drone
dhcp-option=42,192.168.50.1
